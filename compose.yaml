services:

  postgres:
    image: postgres:18.6
    container_name: route-optimization-postgres

    environment:
      POSTGRES_DB: route_optimization_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - route-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: intelligent-route-optimization-app

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/route_optimization_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"

    volumes:
      - ./data/osm:/app/data/osm:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  route-postgres-data:
